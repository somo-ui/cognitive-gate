name: Design proposal
description: Propose a rule, audit, adapter, or governance improvement.
title: "[Proposal]: "
labels: ["proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for ideas that improve deterministic intent compilation, constraint inheritance, auditability, or fail-safe behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user boundary, model behavior, or audit gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Intent compilation
        - Constraint storage
        - Audit history
        - Model adapter
        - Fail-safe behavior
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What test, demo, or audit record would prove it works?
    validations:
      required: true
