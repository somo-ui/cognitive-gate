[metadata]
name = cognitive-gate
version = 0.1.3
description = Installable reference implementation for auditable AI constraints
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = somo-ui
keywords = ai-agents, ai-safety, ai-governance, guardrails, constraints, audit, agentic-ai
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = cognitive_gate
py_modules = demo
python_requires = >=3.9
include_package_data = True

[options.entry_points]
console_scripts =
    cognitive-gate = demo:main
