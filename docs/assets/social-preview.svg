<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Gate social preview</title>
  <desc id="desc">Cognitive Gate turns user constraints into auditable AI checks.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#f8fafc"/>
  <text x="110" y="160" fill="#0f172a" font-size="62" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Cognitive Gate</text>
  <text x="112" y="218" fill="#334155" font-size="29" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Auditable AI constraints. Local decision records. No API key demo.</text>
  <rect x="112" y="286" width="205" height="84" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="154" y="338" fill="#115e59" font-size="28" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Compile</text>
  <path d="M335 328 L415 328" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="440" y="286" width="205" height="84" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="501" y="338" fill="#1d4ed8" font-size="28" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Audit</text>
  <path d="M663 328 L743 328" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="768" y="286" width="205" height="84" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="820" y="338" fill="#991b1b" font-size="28" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Block</text>
  <text x="112" y="468" fill="#0f172a" font-size="28" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">pip install git+https://github.com/somo-ui/cognitive-gate.git@v0.1.4</text>
  <text x="112" y="512" fill="#64748b" font-size="24" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Reference implementation for AI agent guardrails and model-agnostic output checks.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#475569"/>
    </marker>
  </defs>
</svg>
